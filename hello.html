<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Hello!</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
        <style> 
        .centered {
            text-align: center;
        }
            h1 {
                color: pink;
                -webkit-text-stroke: 1px black;
            }
            h2 {
                color: rgb(111, 145, 156);
                -webkit-text-stroke: 1px black;
            }
            h3 {
                color: rgb(95, 181, 95);
                -webkit-text-stroke: 1px black;
            }
            body {
                font-family: 'DM Sans', sans-serif;
                background-color: white;
            }
        </style>
    </head>
    <body>
            <h1 class="centered">Welcome to my Website!</h1>
            <h2 class="centered">This is a 2nd heading</h2>
            <h3 class="centered">This is a 3rd heading</h3>
            <span style="color: #888888;">Hello, World!</span>
    </body>
</html>
